plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'project-report'
    id "io.github.ben-manes.versions" version '0.64.0'
}

group = 'io.github.igrqb'
version = '0.6.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.jnr:jnr-ffi:2.3.3'
    implementation 'org.slf4j:slf4j-api:2.0.20'
    implementation 'ch.qos.logback:logback-classic:1.6.4'

    testImplementation(platform('org.junit:junit-bom:6.1.3'))
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.junit.platform:junit-platform-suite-engine:6.1.3'
    testImplementation 'commons-io:commons-io:2.22.0'
    testImplementation 'com.twelvemonkeys.imageio:imageio-batik:3.15.2'
    testImplementation 'org.apache.pdfbox:pdfbox:3.0.8'
    testImplementation 'org.apache.xmlgraphics:batik-transcoder:1.19'
    testImplementation 'org.bytedeco:javacv:1.5.14'
    testImplementation 'org.bytedeco:openblas:0.3.34-1.5.14'
    testImplementation 'org.bytedeco:openblas:0.3.34-1.5.14:linux-x86_64'
    testImplementation 'org.bytedeco:opencv:4.14.0-1.5.14'
    testImplementation 'org.bytedeco:opencv:4.14.0-1.5.14:linux-x86_64'
}

configurations.all {
    exclude group: 'org.bytedeco', module: 'opencv-platform'
    exclude group: 'org.bytedeco', module: 'javacv-platform'
    exclude group: 'org.bytedeco', module: 'openblas-platform'
}

def isNonStable = { String version ->
    // added -JRE for guava
    def stableKeyword = ['RELEASE', 'FINAL', 'GA', '-JRE'].any { theVersion -> version.toUpperCase().contains(theVersion) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    description 'Displays the dependency updates for the project via https://github.com/ben-manes/gradle-versions-plugin'
    rejectVersionIf {
      isNonStable(it.candidate.version)
    }
}

test {
    useJUnitPlatform()
}



java {
    withSourcesJar()
    withJavadocJar()
}


publishing {
    repositories {
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy').get().asFile.toURI()
        }
    }

    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'jnr-graphviz'
                packaging = 'jar'
                description = 'Java bindings for simple Graphviz commands using JNR'
                url = 'https://github.com/igrqb/jnr-graphviz'

                scm {
                    connection = 'scm:git:https://github.com/igrqb/jnr-graphviz.git'
                    developerConnection = 'scm:git:ssh:git@github.com:igrqb/jnr-graphviz.git'
                    url = 'https://github.com/igrqb/jnr-graphviz'
                }

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://mit-license.org/'
                    }
                }

                developers {
                    developer {
                        id = 'igrqb'
                        name = 'igrqb'
                        email = 'igrqb@duck.com'
                    }
                }
            }

            from components.java
        }
    }
}


signing {
    useGpgCmd()
    sign publishing.publications.mavenJava
}